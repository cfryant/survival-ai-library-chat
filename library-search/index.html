<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survival AI - Library Chat (offline)</title>
<style>
:root{color-scheme:dark}body{margin:0;font:16px/1.5 system-ui,Segoe UI,sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;background:#1d2a1d;border-bottom:1px solid #333}header b{color:#9f9}header small{color:#aaa}
header a{color:#8cf}#log{flex:1;overflow:auto;padding:12px 16px}
.m{max-width:900px;margin:0 auto 14px;padding:10px 14px;border-radius:10px;white-space:pre-wrap}
.u{background:#243447}.a{background:#1e1e1e;border:1px solid #333}.src{font-size:13px;color:#bbb;margin-top:8px;border-top:1px solid #333;padding-top:6px;white-space:normal}
.src a{color:#8cf}.warn{color:#fc6;font-size:13px}
form{display:flex;gap:8px;padding:10px 16px;background:#1a1a1a;border-top:1px solid #333}
textarea{flex:1;font:inherit;background:#222;color:#eee;border:1px solid #444;border-radius:8px;padding:8px;resize:none;height:54px}
button{font:inherit;padding:0 18px;border-radius:8px;border:0;background:#2e7d32;color:#fff;cursor:pointer}button:disabled{background:#555}
#ex button{background:#333;margin:2px;padding:4px 10px;font-size:13px}
</style></head><body>
<header><b>Survival AI - Library Chat</b> <small id="info">offline</small><br>
<small>Answers are drawn from your <b>Survival Library</b> PDFs and cite the file to open. Not medical certainty: the official guides win. 
Click a source to open the PDF. &middot; <a href="http://127.0.0.1:8080" target="_blank">Plain AI chat (no library)</a> &middot; <a href="#" id="clr">New chat</a></small>
<div id="ex"></div></header>
<div id="log"></div>
<form id="f"><textarea id="q" placeholder="Ask a survival or first-aid question... (Enter to send, Shift+Enter for new line)"></textarea><button id="b">Ask</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),b=document.getElementById('b');let hist=[];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4} (.*)$/gm,'<b>$1</b>');
fetch('/api/info').then(r=>r.json()).then(i=>{document.getElementById('info').textContent=`offline - ${i.files} guides, ${i.chunks} passages indexed (${i.mode} mode)`});
['How do I purify water with no power?','Signs and first aid for hypothermia','Generator carbon monoxide safety','How to stop severe bleeding'].forEach(t=>{const e=document.createElement('button');e.textContent=t;e.onclick=()=>{q.value=t;send()};document.getElementById('ex').appendChild(e)});
document.getElementById('clr').onclick=e=>{e.preventDefault();hist=[];log.innerHTML=''};
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=1e9;return d}
async function send(){const t=q.value.trim();if(!t||b.disabled)return;q.value='';b.disabled=true;
 add('u',esc(t));hist.push({role:'user',content:t});const d=add('a','');const te=document.createElement('div');te.innerHTML='<span class="warn">Searching the library and thinking...</span>';const se=document.createElement('div');d.appendChild(te);d.appendChild(se);let srcShown=false;
 let txt='',src=[];
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist,stream:true})});
  if(!r.ok){const e=await r.json();throw new Error(e.error||r.status)}
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;const p=line.slice(5).trim();if(p==='[DONE]')continue;
    try{const j=JSON.parse(p);if(j.sources){src=j.sources;render();continue}const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(c){txt+=c;render()}}catch(e){}}}
 }catch(e){txt+=(txt?'\n\n':'')+'Error: '+e.message}
 function render(){const nb=log.scrollHeight-log.scrollTop-log.clientHeight<80;if(txt)te.innerHTML=md(txt);if(src.length&&!srcShown){srcShown=true;se.innerHTML='<div class="src"><b>Sources in your Survival Library:</b><br>'+src.map(s=>`[${s.n}] <a href="/pdf/${s.file.split(/[\\\/]/).map(encodeURIComponent).join('/')}#page=${s.page}" target="_blank">${esc(s.title)} - open at page ${s.page}</a><br>&nbsp;&nbsp;&nbsp;&nbsp;file: <code>${esc(s.path)}</code> (page ${s.page})`).join('<br>')+'</div>'}if(nb)log.scrollTop=1e9}
 render();hist.push({role:'assistant',content:txt});b.disabled=false;q.focus()}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send()};
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
</script></body></html>
